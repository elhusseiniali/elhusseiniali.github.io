cv:
  name: Ali El Husseini
  label: PhD Candidate, National University of Singapore
  email: elhusseiniali@u.nus.edu
  location: Singapore
  image: ""
  summary: >
    PhD candidate in the Programming Languages and Software Engineering (PLSE) lab at the National
    University of Singapore, advised by Prof. Abhik Roychoudhury and Prof. Blaise Genest, and part of
    the Descartes program. My research focuses on improving the security of large language models
    (and the agentic systems built on top of them) by understanding and analyzing how these models operate.

  social_networks:
    - network: GitHub
      username: elhusseiniali

  sections:
    Education:
      - institution: National University of Singapore
        location: Singapore
        area: Computer Science
        studyType: PhD Candidate, Programming Languages and Software Engineering (PLSE) lab
        start_date: 2023-01
        end_date: present
        highlights:
          - "Advised by Prof. Abhik Roychoudhury and Prof. Blaise Genest, as part of the Descartes program."
          - "Research focus: improving the security of large language models and LLM-based agent systems."

      - institution: Ecole Normale Superieure
        location: Paris, France
        area: Computer Science
        studyType: "M1 and M2, Parisian Masters of Research in Computer Science (MPRI)"
        start_date: 2019-09
        end_date: 2022-12

      - institution: American University of Beirut
        location: Beirut, Lebanon
        area: Computer Science and Philosophy
        studyType: "BS in Computer Science, BA in Philosophy"
        start_date: 2014-09
