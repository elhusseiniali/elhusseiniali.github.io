    Experience:
      - company: INRIA Paris
        position: Research Intern
        location: Paris, France
        start_date: 2022-03
        end_date: 2022-08
        summary: >
          Worked on an abstract domain to represent data transformations inside Jupyter notebooks,
          implemented within LiSA (https://github.com/UniVE-SSV/pylisa/), to study the safety and
          sensitivity of notebooks to changes in data shapes and the soundness of results. Supervised
          by Dr. Caterina Urban.

      - company: Commissariat à l'Énergie Atomique (CEA)
        position: Research Intern
        location: France
        start_date: 2021-04
        end_date: 2021-09
        summary: >
          Used abstract interpretation to verify formal properties (e.g., robustness) of neural
          networks, focusing on the soundness of the numerical computations required by the analysis
          on GPUs. Supervised by Dr. Zakaria Chihani and Augustin Lemesle.

      - company: Centre National de la Recherche Scientifique (CNRS)
        position: Research Intern
        location: France
        start_date: 2020-06
        end_date: 2020-08
        summary: >
          Developed a modern Python library to handle Simple Regular Expressions (see
          https://doi.org/10.1023/B:FORM.0000033962.51898.1a), to facilitate the analysis of lossy
          channel systems and verification of formal properties. Supervised by Dr. Philippe
          Schnoebelen. Code: https://github.com/elhusseiniali/sre.

    Publications:
      - title: Repairing LLM Executions for Secure Automatic Programming
        authors:
          - Ali El Husseini
          - Yacine Izza
          - Blaise Genest
          - Abhik Roychoudhury
        publisher: International Conference on Software Engineering (ICSE)
        releaseDate: 2026
        url: https://abhikrc.com/pdf/ICSE26-security.pdf
        summary: >
          Proposed a novel approach to identify and repair internal representations that cause a large
          language model to produce vulnerable code, via a tool that monitors the LLM at run-time and
          intervenes to improve the security of the generated code.

      - title: Detecting Python Malware in the Software Supply Chain with Program Analysis
        authors:
          - Ridwan Shariffdeen
          - Behnaz Hassanshahi
          - Martin Mirchev
          - Ali El Husseini
          - Abhik Roychoudhury
        publisher: "International Conference on Software Engineering: Software Engineering in Practice (ICSE-SEIP)"
        releaseDate: 2025
        url: https://abhikrc.com/pdf/ICSE25_SEIP.pdf
        summary: >
          Proposed a program-analysis-based approach to detect supply chain attacks in the Python
          ecosystem, combining AST-level differential analysis, CodeQL-based behavioral detection, and
          transitive dependency tracking to identify malicious Python packages.

    Languages:
